apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fcg
spec:
  rules:
    - http:
        paths:
          - path: /api/usuarios
            pathType: Prefix
            backend:
              service:
                name: usuarios-api
                port:
                  name: http
          - path: /api/jogos
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
          - path: /api/biblioteca
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
          - path: /api/pedidos
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
          # Swagger do Catálogo (Swagger__RoutePrefix=swagger-catalogo). Sem rewrite: a UI usa URL relativa.
          - path: /swagger-catalogo
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
          # Swagger do Usuários (Swagger__RoutePrefix=swagger-usuarios). Sem rewrite: a UI usa URL relativa.
          - path: /swagger-usuarios
            pathType: Prefix
            backend:
              service:
                name: usuarios-api
                port:
                  name: http
