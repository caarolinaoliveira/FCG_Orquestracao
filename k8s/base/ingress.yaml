# Rotas reais dos controllers. A classe do Ingress (ingressClassName) é definida em cada overlay.
# Sem "host": atende pelo IP do controlador. /health não é exposto (as probes batem direto no pod).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fcg
spec:
  rules:
    - http:
        paths:
          - path: /api/usuarios
            pathType: Prefix
            backend:
              service:
                name: usuarios-api
                port:
                  name: http
          - path: /api/jogos
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
          - path: /api/biblioteca
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
          - path: /api/pedidos
            pathType: Prefix
            backend:
              service:
                name: catalogo-api
                port:
                  name: http
