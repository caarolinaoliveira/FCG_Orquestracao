apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/component: infra
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999 # usuário "rabbitmq" da imagem
        # Sem isso, a cada montagem o kubelet refaz recursivamente grupo e permissões do disco.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # O fsGroup deixa o .erlang.cookie com acesso de grupo, e o Erlang exige 600 (só o dono).
        - name: corrigir-cookie-erlang
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              f=/var/lib/rabbitmq/.erlang.cookie
              if [ -f "$f" ]; then chown 999:999 "$f" && chmod 600 "$f"; fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: infra-secrets
                  key: RABBITMQ_DEFAULT_PASS
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: fcg-rabbitmq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    # Painel de gerenciamento: acesso só via "kubectl port-forward" (não passa pelo Ingress).
    - name: management
      port: 15672
      targetPort: management
