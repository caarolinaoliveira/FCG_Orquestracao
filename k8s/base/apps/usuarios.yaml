apiVersion: v1
kind: ConfigMap
metadata:
  name: usuarios-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  RabbitMQ__Host: fcg-rabbitmq
  RabbitMQ__Port: "5672"
  MongoDB__ConnectionString: mongodb://fcg-mongodb:27017
  MongoDB__EventLogDatabase: FCG_EventLog
  Redis__ConnectionString: fcg-redis:6379
  # Swagger em Production (para a demonstração), com prefixo próprio porque o Ingress só encaminha cada caminho
  # a um serviço. Para desligar: "false" + remover a regra do Ingress.
  Swagger__Habilitado: "true"
  Swagger__RoutePrefix: swagger-usuarios
  JwtSettings__Emissor: FCG
  JwtSettings__Audiencia: FCG.Client
  JwtSettings__ExpiracaoHoras: "2"
  NEW_RELIC_APP_NAME: FCG-UsuariosAPI
  NEW_RELIC_AGENT_ENABLED: "true"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: usuarios-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: usuarios-api
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: aguardar-dependencias
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for hp in fcg-sqlserver:1433 fcg-rabbitmq:5672 fcg-mongodb:27017 fcg-redis:6379; do
                until nc -z "${hp%:*}" "${hp#*:}"; do echo "aguardando $hp"; sleep 3; done
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
      containers:
        - name: usuarios-api
          image: fcgcarolina.azurecr.io/usuarios-api
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: usuarios-config
            - secretRef:
                name: usuarios-secrets
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # A API aplica as migrations no startup: a startupProbe dá tempo antes de liveness/readiness.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: usuarios-api
  ports:
    - name: http
      port: 80
      targetPort: http
