# Worker sem HTTP: não há probes (o Kubernetes reinicia o processo se ele cair).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagamentos-config
data:
  DOTNET_ENVIRONMENT: Production
  RabbitMQ__Host: fcg-rabbitmq
  RabbitMQ__Port: "5672"
  MongoDB__ConnectionString: mongodb://fcg-mongodb:27017
  MongoDB__EventLogDatabase: FCG_EventLog
  NEW_RELIC_APP_NAME: FCG-PagamentosWorker
  NEW_RELIC_AGENT_ENABLED: "true"
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-worker
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pagamentos-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pagamentos-worker
        app.kubernetes.io/component: app
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: aguardar-dependencias
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              for hp in fcg-sqlserver:1433 fcg-rabbitmq:5672 fcg-mongodb:27017; do
                until nc -z "${hp%:*}" "${hp#*:}"; do echo "aguardando $hp"; sleep 3; done
              done
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 16Mi }
      containers:
        - name: pagamentos-worker
          image: fcgcarolina.azurecr.io/pagamentos-worker
          envFrom:
            - configMapRef:
                name: pagamentos-config
            - secretRef:
                name: pagamentos-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
