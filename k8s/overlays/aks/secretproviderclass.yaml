# Lê os segredos do Azure Key Vault "kv-fcg-carolina" (complemento Azure Key Vault Secrets Provider)
# e os sincroniza como Secrets do Kubernetes (secretObjects).
#
# IMPORTANTE: os Secrets só são criados/sincronizados quando ALGUM pod monta o volume CSI desta
# SecretProviderClass. Por isso os Deployments que consomem segredos montam o volume (ver csi-volumes.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: kv-fcg-carolina
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    # >>> PREENCHER APÓS CRIAR O CLUSTER <<<
    # Client ID da identidade gerenciada do complemento azure-keyvault-secrets-provider:
    #   az aks show --subscription <fcg-aks-payg> -g rg-fcg-aks -n <nome-do-cluster> \
    #     --query "addonProfiles.azureKeyvaultSecretsProvider.identity.clientId" -o tsv
    # (o infra/create-aks.ps1 imprime esse valor ao final). Substitua o texto abaixo por ele.
    userAssignedIdentityID: "e4bd3d9b-a41d-42fd-bb5f-a819aef43eea"
    keyvaultName: kv-fcg-carolina
    tenantId: ec3d901f-a4e2-4c16-b17f-b6edcd8def88
    objects: |
      array:
        - |
          objectName: sql-sa-password
          objectType: secret
        - |
          objectName: sql-conn-usuarios
          objectType: secret
        - |
          objectName: sql-conn-catalogo
          objectType: secret
        - |
          objectName: sql-conn-pagamentos
          objectType: secret
        - |
          objectName: rabbitmq-user
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
        - |
          objectName: newrelic-license-key
          objectType: secret
  secretObjects:
    - secretName: infra-secrets
      type: Opaque
      data:
        - objectName: sql-sa-password
          key: MSSQL_SA_PASSWORD
        - objectName: rabbitmq-user
          key: RABBITMQ_DEFAULT_USER
        - objectName: rabbitmq-password
          key: RABBITMQ_DEFAULT_PASS
    - secretName: usuarios-secrets
      type: Opaque
      data:
        - objectName: sql-conn-usuarios
          key: ConnectionStrings__DefaultConnection
        - objectName: rabbitmq-user
          key: RabbitMQ__Usuario
        - objectName: rabbitmq-password
          key: RabbitMQ__Senha
        - objectName: jwt-secret
          key: JwtSettings__Segredo
        - objectName: newrelic-license-key
          key: NEW_RELIC_LICENSE_KEY
    - secretName: catalogo-secrets
      type: Opaque
      data:
        - objectName: sql-conn-catalogo
          key: ConnectionStrings__DefaultConnection
        - objectName: rabbitmq-user
          key: RabbitMQ__Usuario
        - objectName: rabbitmq-password
          key: RabbitMQ__Senha
        - objectName: jwt-secret
          key: JwtSettings__Segredo
        - objectName: newrelic-license-key
          key: NEW_RELIC_LICENSE_KEY
    - secretName: pagamentos-secrets
      type: Opaque
      data:
        - objectName: sql-conn-pagamentos
          key: ConnectionStrings__DefaultConnection
        - objectName: rabbitmq-user
          key: RabbitMQ__Usuario
        - objectName: rabbitmq-password
          key: RabbitMQ__Senha
        - objectName: newrelic-license-key
          key: NEW_RELIC_LICENSE_KEY
    - secretName: notificacoes-secrets
      type: Opaque
      data:
        - objectName: rabbitmq-user
          key: RabbitMQ__Usuario
        - objectName: rabbitmq-password
          key: RabbitMQ__Senha
        - objectName: newrelic-license-key
          key: NEW_RELIC_LICENSE_KEY
