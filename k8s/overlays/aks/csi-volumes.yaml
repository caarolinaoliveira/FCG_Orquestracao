# Monta o volume CSI da SecretProviderClass nos Deployments que consomem segredos.
# Sem o volume montado, o Secret do Kubernetes NÃO é sincronizado a partir do Key Vault.
# (Mongo, Redis e Elasticsearch não usam segredos, então não montam e não dependem do Key Vault.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
spec:
  template:
    spec:
      containers:
        - name: sqlserver
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: kv-fcg-carolina
---
