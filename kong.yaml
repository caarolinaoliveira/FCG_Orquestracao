_format_version: "3.0"
_transform: true

services:
  - name: usuarios-api
    url: http://fcg-usuarios-api:8080
    routes:
      - name: usuarios-route
        paths:
          - /api/usuarios
        strip_path: false
    plugins:
      - name: jwt

  - name: catalogo-api
    url: http://fcg-catalogo-api:8080
    routes:
      - name: catalogo-route
        paths:
          - /api/catalogo
        strip_path: false
    plugins:
      - name: jwt

# Rota pública para login/registro (sem exigir JWT, já que o usuário ainda não tem token)
  - name: usuarios-auth-api
    url: http://fcg-usuarios-api:8080
    routes:
      - name: usuarios-auth-route
        paths:
          - /api/usuarios/login
          - /api/usuarios/registrar
        strip_path: false

consumers:
  - username: fcg-client
    jwt_secrets:
      - key: FCG
        algorithm: HS256
        secret: CaracteresAleatoriosParaSegredoJWT