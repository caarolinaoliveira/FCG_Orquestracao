services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcg-sqlserver
    environment:
      SA_PASSWORD: "FCG@Pass123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "FCG@Pass123", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "guest"
      RABBITMQ_DEFAULT_PASS: "guest"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kong-database:
    image: postgres:13
    container_name: fcg-kong-database
    environment:
      POSTGRES_USER: "kong"
      POSTGRES_PASSWORD: "kong"
      POSTGRES_DB: "kong"
    volumes:
      - kong_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 10

  kong-migrations:
    image: kong:3.7
    container_name: fcg-kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "fcg-kong-database"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong"
      KONG_PG_DATABASE: "kong"
    depends_on:
      kong-database:
        condition: service_healthy
    restart: "no"

  kong:
    image: kong:3.7
    container_name: fcg-kong
    environment:
      KONG_DATABASE: "postgres"
      KONG_PG_HOST: "fcg-kong-database"
      KONG_PG_USER: "kong"
      KONG_PG_PASSWORD: "kong"
      KONG_PG_DATABASE: "kong"
      KONG_PROXY_ACCESS_LOG: "/dev/stdout"
      KONG_ADMIN_ACCESS_LOG: "/dev/stdout"
      KONG_PROXY_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_ERROR_LOG: "/dev/stderr"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "8000:8000"   # proxy (entrada única do sistema)
      - "8001:8001"   # admin API
    depends_on:
      kong-database:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
      usuarios-api:
        condition: service_started
      catalogo-api:
        condition: service_started
    restart: unless-stopped

  konga:
    image: pantsel/konga:latest
    container_name: fcg-konga
    environment:
      NODE_ENV: "production"
    ports:
      - "1337:1337"
    depends_on:
      - kong
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.8
    container_name: fcg-localstack
    environment:
      SERVICES: "lambda,sqs,dynamodb"
      DEBUG: "1"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    ports:
      - "4566:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
      - ./localstack-init/artifacts:/opt/lambda-artifacts
    restart: unless-stopped

  usuarios-api:
    image: caarolindso/fcg-usuarios-api:latest
    container_name: fcg-usuarios-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=fcg-sqlserver;Database=FCG_Usuarios;User Id=sa;Password=FCG@Pass123;TrustServerCertificate=True"
      RabbitMQ__Host: "fcg-rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Usuario: "guest"
      RabbitMQ__Senha: "guest"
      AWS__SqsServiceUrl: "http://fcg-localstack:4566"
    ports:
      - "5101:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  catalogo-api:
    image: caarolindso/fcg-catalogo-api:latest
    container_name: fcg-catalogo-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=fcg-sqlserver;Database=FCG_Catalogo;User Id=sa;Password=FCG@Pass123;TrustServerCertificate=True"
      RabbitMQ__Host: "fcg-rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Usuario: "guest"
      RabbitMQ__Senha: "guest"
      # FCG_Catalogo não tem appsettings.json no repo — mesmos valores usados por
      # FCG_Usuarios/appsettings.json e pelo consumer JWT do kong.yaml.
      JwtSettings__Segredo: "CaracteresAleatoriosParaSegredoJWT"
      JwtSettings__Emissor: "FCG"
      JwtSettings__Audiencia: "FCG.Client"
    ports:
      - "5133:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  pagamentos-worker:
    image: caarolindso/fcg-pagamentos-worker:latest
    container_name: fcg-pagamentos-worker
    environment:
      DOTNET_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=fcg-sqlserver;Database=FCG_Pagamentos;User Id=sa;Password=FCG@Pass123;TrustServerCertificate=True"
      RabbitMQ__Host: "fcg-rabbitmq"
      RabbitMQ__Port: "5672"
      RabbitMQ__Usuario: "guest"
      RabbitMQ__Senha: "guest"
      AWS__SqsServiceUrl: "http://fcg-localstack:4566"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      localstack:
        condition: service_started
    restart: unless-stopped

  # notificacoes-worker: substituído pela função serverless FCG.Worker.SqsFunction,
  # registrada no LocalStack via localstack-init/00-setup-notificacoes.sh e acionada
  # diretamente pelas filas SQS (Event Source Mapping) — ver FCG_Notificacoes/docs/adr/0002.
  # O código do worker RabbitMQ contínuo continua no repositório (FCG_Notificacoes/FCG.Worker),
  # só não é mais implantado como container de longa duração aqui.
  # notificacoes-worker:
  #   image: caarolindso/fcg-notificacoes-worker:latest
  #   container_name: fcg-notificacoes-worker
  #   environment:
  #     DOTNET_ENVIRONMENT: "Development"
  #     RabbitMQ__Host: "fcg-rabbitmq"
  #     RabbitMQ__Port: "5672"
  #     RabbitMQ__Usuario: "guest"
  #     RabbitMQ__Senha: "guest"
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  sqlserver_data:
  rabbitmq_data:
  localstack_data:
  kong_data: