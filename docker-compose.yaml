# Ambiente local completo do FCG (Fase 4).
# Requer um arquivo .env na mesma pasta: copie o .env.example e troque os valores.
# O .env NÃO é versionado. Nenhuma credencial fica neste arquivo.
name: fcg

# --- Blocos reutilizáveis (âncoras YAML) -------------------------------------

# New Relic é opcional no local: por padrão o agente fica DESLIGADO.
# Para ligar: NEW_RELIC_ENABLED=true e NEW_RELIC_LICENSE_KEY=<sua chave> no .env.
# As variáveis CORECLR_* (profiler) já vêm nos Dockerfiles de cada aplicação.
x-newrelic-env: &newrelic-env
  NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
  NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_ENABLED:-false}
  NEW_RELIC_DISTRIBUTED_TRACING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_ENABLED: "true"
  NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED: "true"

x-rabbitmq-env: &rabbitmq-env
  RabbitMQ__Host: rabbitmq
  RabbitMQ__Port: "5672"
  RabbitMQ__Usuario: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
  RabbitMQ__Senha: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}

x-mongodb-env: &mongodb-env
  MongoDB__ConnectionString: mongodb://mongodb:27017
  MongoDB__EventLogDatabase: FCG_EventLog

x-jwt-env: &jwt-env
  JwtSettings__Segredo: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (minimo 32 caracteres)}
  JwtSettings__Emissor: FCG
  JwtSettings__Audiencia: FCG.Client
  JwtSettings__ExpiracaoHoras: "2"

# --- Infraestrutura -----------------------------------------------------------

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Defina RABBITMQ_USER no arquivo .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672" # interface de gerenciamento
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # "ping" passa antes de a porta AMQP abrir; check_port_connectivity só passa quando os listeners aceitam conexão.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Nenhuma aplicação usa o Elasticsearch hoje; ele está aqui por decisão de arquitetura.
  # Segurança (xpack) DESLIGADA apenas no ambiente local.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false" # Machine Learning não é usado e reserva memória
      ES_JAVA_OPTS: -Xms384m -Xmx384m
    ports:
      - "127.0.0.1:9200:9200"
    # Sem volume: o índice é derivado do SQL Server e será reconstruído por reindexação no startup do Catálogo.
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # --- Aplicações -------------------------------------------------------------
  # O build usa as pastas irmãs (repositórios clonados lado a lado).
  # Para outro layout, defina USUARIOS_CONTEXT, CATALOGO_CONTEXT, PAGAMENTOS_CONTEXT
  # e NOTIFICACOES_CONTEXT no .env.

  usuarios-api:
    build:
      context: ${USUARIOS_CONTEXT:-../FCG_Usuarios}
    image: fcg/usuarios-api:local
    environment:
      <<: [*newrelic-env, *rabbitmq-env, *mongodb-env, *jwt-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FCG_Usuarios;User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env};TrustServerCertificate=True;
      Redis__ConnectionString: redis:6379
      NEW_RELIC_APP_NAME: FCG-UsuariosAPI
    ports:
      - "5101:8080"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure

  catalogo-api:
    # O consumidor de payment.processed roda DENTRO desta API.
    # O projeto FCG.Catalogo.Worker NÃO é implantado (duplicaria o consumo da fila).
    build:
      context: ${CATALOGO_CONTEXT:-../FCG_Catalogo}
    image: fcg/catalogo-api:local
    environment:
      <<: [*newrelic-env, *rabbitmq-env, *mongodb-env, *jwt-env]
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FCG_Catalogo;User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env};TrustServerCertificate=True;
      Redis__ConnectionString: redis:6379
      NEW_RELIC_APP_NAME: FCG-CatalogoAPI
    ports:
      - "5133:8080"
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: on-failure

  pagamentos-worker:
    build:
      context: ${PAGAMENTOS_CONTEXT:-../FCG_Pagamentos}
    image: fcg/pagamentos-worker:local
    environment:
      <<: [*newrelic-env, *rabbitmq-env, *mongodb-env]
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=FCG_Pagamentos;User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env};TrustServerCertificate=True;
      NEW_RELIC_APP_NAME: FCG-PagamentosWorker
    depends_on:
      sqlserver: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    restart: on-failure

  notificacoes-worker:
    build:
      context: ${NOTIFICACOES_CONTEXT:-../FCG_Notificacoes}
    image: fcg/notificacoes-worker:local
    environment:
      <<: [*newrelic-env, *rabbitmq-env]
      DOTNET_ENVIRONMENT: Development
      NEW_RELIC_APP_NAME: FCG-NotificacoesWorker
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: on-failure

volumes:
  sqlserver_data:
  rabbitmq_data:
  mongodb_data:
